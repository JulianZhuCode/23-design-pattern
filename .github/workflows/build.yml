name: build

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  compile:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile and test with Maven Wrapper
        shell: bash
        working-directory: design-patternz
        run: bash ./mvnw clean test